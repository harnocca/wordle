[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[project]
name = "wordle-lib"
version = "0.1.0"
description = "A C extension for Wordle analysis"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["wordle_lib"]

[[tool.setuptools.ext-modules]]
name = "_wordle_lib"
sources = ["wordle_lib.c"]
libraries = ["m"]
